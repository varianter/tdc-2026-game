name: Release macOS binaries

on:
  release:
    types: [published]

permissions:
  contents: write 

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build arm64 (Apple Silicon)
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" -o dist/tdcgame-macos-arm64 .

      - name: Build amd64 (Intel)
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" \
            go build -trimpath -ldflags="-s -w" -o dist/tdcgame-macos-amd64 .

      - name: Show binary sizes
        run: ls -lh dist/

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
